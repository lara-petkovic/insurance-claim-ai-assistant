<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1600" viewBox="0 0 1000 1600" role="img" aria-labelledby="title description">
  <title id="title">Архитектура вишеагентског система за анализу захтева за осигурање</title>
  <desc id="description">Вертикални архитектонски дијаграм који приказује корисника, Angular клијент, серверску апликацију, API слој, обраду докумената, вишеагентски аналитички слој, моделски клијент и спољне AI моделе.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#173b71" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0b3474"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#009c52"/>
    </marker>
    <style>
      .server { fill: #f7faff; stroke: #0b3474; stroke-width: 1.6; stroke-dasharray: 7 5; }
      .layer { fill: #ffffff; stroke: #0b3474; stroke-width: 1.5; }
      .box-blue { fill: #ffffff; stroke: #0b3474; stroke-width: 2; }
      .box-green { fill: #ffffff; stroke: #009c52; stroke-width: 2; }
      .box-context { fill: #e2f5e9; stroke: #009c52; stroke-width: 1.8; }
      .box-orchestrator { fill: #214b87; stroke: #123a73; stroke-width: 1.8; }
      .line-blue { fill: none; stroke: #0b3474; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
      .line-green { fill: none; stroke: #009c52; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
      .dash-blue { stroke-dasharray: 6 5; }
      .model-call { stroke-dasharray: 6 5; }
      .text-main, .text-server, .text-layer, .text-node, .text-small {
        font-family: "Times New Roman", Times, serif;
        font-size: 22px;
        font-weight: 700;
        fill: #0b3474;
      }
      .text-orchestrator {
        font-family: "Times New Roman", Times, serif;
        font-size: 22px;
        font-weight: 700;
        fill: #ffffff;
      }
    </style>
  </defs>

  <rect width="1000" height="1600" fill="#ffffff"/>

  <g transform="translate(55 0)">

  <!-- Корисник -->
  <g filter="url(#shadow)">
    <rect x="310" y="36" width="269" height="88" rx="8" class="box-blue"/>
  </g>
  <text x="444.5" y="85" text-anchor="middle" class="text-main">Корисник</text>

  <path d="M444.5 124 V178" class="line-blue" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>

  <!-- Angular клијент -->
  <g filter="url(#shadow)">
    <rect x="310" y="178" width="269" height="89" rx="8" class="box-blue"/>
  </g>
  <text x="444.5" y="227" text-anchor="middle" class="text-main">Angular клијент</text>

  <!-- Серверска апликација -->
  <rect x="-11" y="320" width="912" height="1156" rx="14" class="server"/>
  <text x="7" y="352" class="text-server">Серверска апликација</text>

  <!-- API слој -->
  <g filter="url(#shadow)">
    <rect x="310" y="373" width="269" height="90" rx="8" class="box-blue"/>
  </g>
  <text x="444.5" y="423" text-anchor="middle" class="text-main">API слој</text>

  <path d="M444.5 267 V373" class="line-blue" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>

  <!-- Повратни ток ка API слоју -->
  <path d="M310 1351 H11 V418 H310" class="line-blue" marker-end="url(#arrow-blue)"/>

  <path d="M444.5 463 V516" class="line-blue" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>

  <!-- Обрада докумената -->
  <g filter="url(#shadow)">
    <rect x="310" y="516" width="269" height="89" rx="8" class="box-green"/>
  </g>
  <text x="444.5" y="566" text-anchor="middle" class="text-main">Обрада докумената</text>

  <!-- Вишеагентски аналитички слој -->
  <rect x="33" y="658" width="823" height="622" rx="11" class="layer"/>
  <text x="444" y="690" text-anchor="middle" class="text-layer">Вишеагентски аналитички слој</text>

  <!-- Динамички планер -->
  <g filter="url(#shadow)">
    <rect x="85" y="720" width="235" height="72" rx="8" class="box-green"/>
  </g>
  <text x="202.5" y="762" text-anchor="middle" class="text-small">Динамички планер</text>

  <!-- Двосмерна веза планера и оркестратора -->
  <path d="M320 756 H373" class="line-green" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>

  <!-- Оркестратор -->
  <g filter="url(#shadow)">
    <rect x="373" y="720" width="383" height="72" rx="8" class="box-orchestrator"/>
  </g>
  <text x="564.5" y="762" text-anchor="middle" class="text-orchestrator">Оркестратор</text>

  <!-- API директно формира захтев и позива Оркестратор -->
  <path d="M579 418 H820 V756 H756" class="line-blue" marker-end="url(#arrow-blue)"/>

  <!-- Оркестраторска магистрала ка групама агената -->
  <path d="M426 792 V951.5" class="line-blue" marker-start="url(#arrow-blue)"/>
  <path d="M426 827.5 H462" class="line-blue" marker-end="url(#arrow-blue)"/>
  <path d="M426 889.5 H462" class="line-blue" marker-end="url(#arrow-blue)"/>
  <path d="M426 951.5 H462" class="line-blue" marker-end="url(#arrow-blue)"/>

  <!-- Групе агената -->
  <g filter="url(#shadow)">
    <rect x="462" y="800" width="294" height="55" rx="8" class="box-blue"/>
  </g>
  <text x="609" y="834" text-anchor="middle" class="text-small">Функционални агенти</text>

  <g filter="url(#shadow)">
    <rect x="462" y="862" width="294" height="55" rx="8" class="box-blue"/>
  </g>
  <text x="609" y="896" text-anchor="middle" class="text-small">Технички агенти</text>

  <g filter="url(#shadow)">
    <rect x="462" y="924" width="294" height="55" rx="8" class="box-blue"/>
  </g>
  <text x="609" y="958" text-anchor="middle" class="text-small">Валидациони агенти</text>

  <!-- Контекстуална магистрала -->
  <path d="M795 827.5 V951.5" class="line-green"/>
  <path d="M756 827.5 H795" class="line-green" marker-start="url(#arrow-green)"/>
  <path d="M756 889.5 H795" class="line-green" marker-start="url(#arrow-green)"/>
  <path d="M756 951.5 H795" class="line-green" marker-start="url(#arrow-green)"/>
  <path d="M795 951.5 V1022 H444 V1048" class="line-green" marker-end="url(#arrow-green)"/>

  <!-- Оркестратор управља заједничким контекстом -->
  <path d="M405 792 V1048" class="line-green" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>

  <!-- Потенцијални позиви ка Моделском клијенту: обрада PDF-а, планер, технички и поједини валидациони агенти -->
  <path d="M579 560.5 H879 V1431 H579" class="line-green model-call" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <path d="M202.5 720 V705 H879" class="line-green model-call" marker-start="url(#arrow-green)"/>
  <path d="M756 879 H788 C788 870 802 870 802 879 H813 C813 870 827 870 827 879 H879" class="line-green model-call" marker-start="url(#arrow-green)"/>
  <path d="M756 941 H788 C788 932 802 932 802 941 H813 C813 932 827 932 827 941 H879" class="line-green model-call" marker-start="url(#arrow-green)"/>

  <!-- Заједнички контекст -->
  <g filter="url(#shadow)">
    <rect x="133" y="1048" width="623" height="55" rx="8" class="box-context"/>
  </g>
  <text x="444.5" y="1083" text-anchor="middle" class="text-small">Заједнички контекст</text>

  <!-- Синтеза је део плана агената: Оркестратор је позива, а она чита заједнички контекст -->
  <path d="M444.5 1103 V1191" class="line-green" marker-end="url(#arrow-green)"/>
  <path d="M756 770 H820 V1227 H623" class="line-blue" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="266" y="1191" width="357" height="72" rx="8" class="box-blue"/>
  </g>
  <text x="444.5" y="1233" text-anchor="middle" class="text-main">Синтеза коначне одлуке</text>

  <!-- Излаз -->
  <path d="M444.5 1280 V1315" class="line-blue" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="310" y="1315" width="269" height="72" rx="8" class="box-green"/>
  </g>
  <text x="444.5" y="1358" text-anchor="middle" class="text-main">Излаз анализе</text>

  <!-- Моделски клијент -->
  <g filter="url(#shadow)">
    <rect x="310" y="1404" width="269" height="55" rx="8" class="box-blue"/>
  </g>
  <text x="444.5" y="1438" text-anchor="middle" class="text-small">Моделски клијент</text>

  <!-- Спољни AI модели -->
  <path d="M444.5 1459 V1511" class="line-blue dash-blue" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="346" y="1511" width="197" height="63" rx="8" class="box-blue"/>
  </g>
  <text x="444.5" y="1550" text-anchor="middle" class="text-small">Спољни AI модели</text>
  </g>
</svg>
