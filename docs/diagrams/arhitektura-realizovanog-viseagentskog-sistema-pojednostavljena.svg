<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 50 1600 1140" role="img" aria-labelledby="title description">
  <title id="title">Архитектура реализованог вишеагентског система</title>
  <desc id="description">Поједностављен приказ контролисаног вишеагентског тока од планирања, преко припреме и анализе, до критике, синтезе и људске одлуке.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#173F79"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2D8B69"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#DC7B1D"/>
    </marker>
    <style>
      text { font-family: Georgia, "Times New Roman", serif; }
      .title { font-size: 31px; font-weight: 700; fill: #173F79; letter-spacing: .3px; }
      .area-title { font-size: 25px; font-weight: 700; fill: #173F79; }
      .section-title { font-size: 19px; font-weight: 700; fill: #4B5563; letter-spacing: .4px; }
      .agent { font-size: 19px; font-weight: 700; fill: #24364F; }
      .agent-small { font-size: 15.5px; font-weight: 700; fill: #24364F; }
      .agent-tiny { font-size: 14px; font-weight: 700; fill: #24364F; }
      .agent-white { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
      .body { font-size: 17px; fill: #475569; }
      .small { font-size: 15px; fill: #526174; }
      .label { font-size: 16px; font-weight: 700; fill: #173F79; }
      .repair-label { font-size: 17px; font-weight: 700; fill: #B85F10; }
      .legend { font-size: 16px; fill: #334155; }

      .area { fill: #FFFFFF; stroke: #C7D2E0; stroke-width: 2; }
      .area-tab { fill: #EEF3F9; }
      .blue { fill: #F7FAFE; stroke: #173F79; stroke-width: 2.1; }
      .blue-strong { fill: #173F79; stroke: #173F79; stroke-width: 2.1; }
      .green { fill: #F3FBF7; stroke: #2D8B69; stroke-width: 2; }
      .neutral { fill: #F8FAFC; stroke: #7A8798; stroke-width: 1.8; }
      .orange { fill: #FFF7ED; stroke: #DC7B1D; stroke-width: 2.1; }
      .optional { fill: #FCFDFE; stroke: #7A8798; stroke-width: 1.8; stroke-dasharray: 8 6; }
      .state { fill: #F4FBF7; stroke: #2D8B69; stroke-width: 2; stroke-dasharray: 8 6; }

      .flow { fill: none; stroke: #173F79; stroke-width: 2.7; stroke-linecap: square; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .flow-bus { fill: none; stroke: #173F79; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: round; }
      .flow-both { fill: none; stroke: #173F79; stroke-width: 2.4; marker-start: url(#arrow-blue); marker-end: url(#arrow-blue); }
      .dependency { fill: none; stroke: #2D8B69; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .dependency-bus { fill: none; stroke: #2D8B69; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: round; }
      .state-line { fill: none; stroke: #2D8B69; stroke-width: 2; stroke-dasharray: 7 6; }
      .repair { fill: none; stroke: #DC7B1D; stroke-width: 3; stroke-dasharray: 10 7; stroke-linecap: square; stroke-linejoin: round; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1600" height="1280" fill="#FFFFFF"/>
  <!-- Управљање и планирање -->
  <g id="control-layer">
    <rect x="30" y="55" width="1540" height="245" rx="12" class="area"/>
    <rect x="30" y="55" width="1540" height="44" rx="11" class="area-tab"/>
    <text x="50" y="85" class="area-title">УПРАВЉАЊЕ И ПЛАНИРАЊЕ</text>

    <rect x="650" y="68" width="300" height="40" rx="8" class="blue"/>
    <text x="800" y="94" text-anchor="middle" class="agent">Кориснички захтев</text>

    <rect x="620" y="121" width="360" height="48" rx="8" class="blue-strong"/>
    <text x="800" y="153" text-anchor="middle" class="agent-white">OrchestratorAgent</text>

    <rect x="585" y="188" width="430" height="62" rx="9" class="blue"/>
    <text x="800" y="226" text-anchor="middle" class="agent">BoundedInvestigationGraph</text>

    <rect x="90" y="185" width="330" height="70" rx="9" class="green"/>
    <text x="255" y="228" text-anchor="middle" class="agent">InvestigationPlannerAgent</text>

    <rect x="1180" y="185" width="330" height="70" rx="9" class="neutral"/>
    <text x="1345" y="228" text-anchor="middle" class="agent">ControlledServiceRegistry</text>

    <path d="M800 108 V121" class="flow"/>
    <path d="M800 169 V188" class="flow"/>
    <path d="M585 220 H420" class="flow"/>
    <text x="503" y="210" text-anchor="middle" class="label">план / задаци</text>
    <path d="M1015 220 H1180" class="flow"/>
    <text x="1098" y="210" text-anchor="middle" class="label">извршавање</text>
  </g>

  <!-- Заједничко стање -->
  <g id="shared-state">
    <rect x="90" y="315" width="1420" height="55" rx="9" class="state"/>
    <text x="800" y="350" text-anchor="middle" class="agent" fill="#1F6F54">AgentContext = ClaimAnalysisRunState</text>
    <path d="M800 250 V315" class="state-line"/>
  </g>

  <!-- Три главне радне целине -->
  <g id="execution-areas">
    <rect x="30" y="395" width="490" height="590" rx="12" class="area"/>
    <rect x="30" y="395" width="490" height="44" rx="11" class="area-tab"/>
    <text x="50" y="425" class="area-title">1. ПРИПРЕМА</text>

    <rect x="540" y="395" width="660" height="590" rx="12" class="area"/>
    <rect x="540" y="395" width="660" height="44" rx="11" class="area-tab"/>
    <text x="560" y="425" class="area-title">2. ДОКАЗИ И АНАЛИЗА</text>

    <rect x="1220" y="395" width="350" height="590" rx="12" class="area"/>
    <rect x="1220" y="395" width="350" height="44" rx="11" class="area-tab"/>
    <text x="1240" y="425" class="area-title">3. ПРОВЕРА</text>

    <path d="M520 417 H540" class="flow"/>
    <path d="M1200 417 H1220" class="flow"/>
    <path d="M275 370 V395 M870 370 V395 M1395 370 V395" class="state-line"/>
  </g>

  <!-- Припрема -->
  <g id="preparation">
    <text x="275" y="470" text-anchor="middle" class="section-title">ДОКУМЕНТИ</text>
    <rect x="105" y="485" width="340" height="52" rx="8" class="green"/>
    <text x="275" y="518" text-anchor="middle" class="agent">DocumentIngestionAgent</text>

    <rect x="50" y="570" width="215" height="66" rx="8" class="green"/>
    <text x="157.5" y="611" text-anchor="middle" class="agent-small">DocumentQualityAgent</text>

    <rect x="285" y="570" width="215" height="66" rx="8" class="green"/>
    <text x="392.5" y="596" text-anchor="middle" class="agent-small">PolicyConcept</text>
    <text x="392.5" y="617" text-anchor="middle" class="agent-small">ExtractionAgent</text>

    <path d="M275 537 V553 H157.5" class="dependency-bus"/>
    <path d="M157.5 553 V570" class="dependency"/>
    <path d="M275 553 H392.5 V570" class="dependency"/>

    <line x1="55" y1="660" x2="495" y2="660" stroke="#D7DFE9" stroke-width="1.5"/>
    <text x="275" y="690" text-anchor="middle" class="section-title" style="font-size:17px">ЧИЊЕНИЦЕ И ДОМЕНСКЕ СМЕРНИЦЕ</text>

    <rect x="50" y="708" width="205" height="60" rx="8" class="green"/>
    <text x="152.5" y="745" text-anchor="middle" class="agent-small">ClaimExtractionAgent</text>

    <rect x="280" y="692" width="220" height="100" rx="8" class="green"/>
    <text x="390" y="718" text-anchor="middle" class="agent-small">GeneralInsurance</text>
    <text x="390" y="739" text-anchor="middle" class="agent-small">FunctionalAgent</text>
    <text x="390" y="762" text-anchor="middle" class="agent-tiny">+ изабрани доменски</text>
    <text x="390" y="781" text-anchor="middle" class="agent-tiny">агент</text>
    <path d="M255 738 H280" class="dependency"/>

    <rect x="50" y="820" width="450" height="110" rx="9" class="optional"/>
    <text x="275" y="853" text-anchor="middle" class="body" font-weight="700">УСЛОВНО: ПРИЛОЖЕНА СЛИКА</text>
    <rect x="70" y="875" width="200" height="42" rx="7" class="green"/>
    <text x="170" y="901" text-anchor="middle" class="agent-small">VisualEvidenceAgent</text>
    <rect x="285" y="875" width="195" height="42" rx="7" class="green"/>
    <text x="382.5" y="892" text-anchor="middle" class="agent-small">ImageAuthenticity</text>
    <text x="382.5" y="910" text-anchor="middle" class="agent-small">Agent</text>
  </g>

  <!-- Докази и анализа -->
  <g id="analysis">
    <rect x="570" y="465" width="245" height="50" rx="8" class="green"/>
    <text x="692.5" y="497" text-anchor="middle" class="agent">QueryRewriteAgent</text>
    <rect x="570" y="535" width="245" height="50" rx="8" class="green"/>
    <text x="692.5" y="567" text-anchor="middle" class="agent">RetrievalAgent</text>
    <path d="M692.5 515 V535" class="dependency"/>

    <rect x="845" y="465" width="325" height="180" rx="10" class="blue"/>
    <rect x="875" y="482" width="265" height="44" rx="7" class="blue-strong"/>
    <text x="1007.5" y="510" text-anchor="middle" class="agent-white" style="font-size:18px">CoverageAnalystAgent</text>

    <rect x="865" y="570" width="135" height="58" rx="7" class="green"/>
    <text x="932.5" y="595" text-anchor="middle" class="agent-tiny">Coverage</text>
    <text x="932.5" y="615" text-anchor="middle" class="agent-tiny">MatchingAgent</text>
    <rect x="1015" y="570" width="135" height="58" rx="7" class="green"/>
    <text x="1082.5" y="595" text-anchor="middle" class="agent-tiny">Exclusion</text>
    <text x="1082.5" y="615" text-anchor="middle" class="agent-tiny">CheckingAgent</text>
    <path d="M1007.5 526 V555 H932.5 V570" class="dependency"/>
    <path d="M1007.5 555 H1082.5 V570" class="dependency"/>
    <path d="M815 560 H845" class="dependency"/>

    <line x1="570" y1="670" x2="1170" y2="670" stroke="#D7DFE9" stroke-width="1.5"/>
    <text x="870" y="700" text-anchor="middle" class="section-title">ПОТПОРНИ ЗАДАЦИ</text>

    <rect x="570" y="718" width="280" height="72" rx="8" class="neutral"/>
    <text x="710" y="760" text-anchor="middle" class="agent-small">MissingDocumentsAgent</text>

    <rect x="870" y="718" width="300" height="72" rx="8" class="neutral"/>
    <text x="1020" y="760" text-anchor="middle" class="agent-small" style="font-size:14.5px">ConsistencyVerificationAgent</text>

    <rect x="570" y="810" width="280" height="82" rx="8" class="optional"/>
    <text x="710" y="858" text-anchor="middle" class="agent-small" style="font-size:14.5px">SettlementCalculationService</text>

    <rect x="870" y="810" width="300" height="82" rx="8" class="green"/>
    <text x="1020" y="858" text-anchor="middle" class="agent">CitationAgent</text>
  </g>

  <!-- Провера -->
  <g id="critique">
    <rect x="1240" y="465" width="310" height="205" rx="10" class="blue"/>
    <rect x="1265" y="482" width="260" height="64" rx="8" class="blue"/>
    <text x="1395" y="521" text-anchor="middle" class="agent-small">OutputValidatorAgent</text>
    <path d="M1395 546 V568" class="flow"/>
    <rect x="1265" y="568" width="260" height="69" rx="8" class="blue-strong"/>
    <text x="1395" y="609" text-anchor="middle" class="agent-white" style="font-size:18px">EvidenceCriticAgent</text>

    <!-- Обједињени резултати анализе улазе у детерминистичку проверу. -->
    <path d="M1200 514 H1265" class="dependency"/>

    <rect x="1245" y="728" width="300" height="55" rx="8" class="neutral"/>
    <text x="1395" y="761" text-anchor="middle" class="agent-small">прихваћени докази</text>
    <rect x="1245" y="798" width="300" height="62" rx="8" class="orange"/>
    <text x="1395" y="836" text-anchor="middle" class="agent-small">поправљив недостатак</text>
    <rect x="1245" y="875" width="300" height="72" rx="8" class="neutral"/>
    <text x="1395" y="903" text-anchor="middle" class="agent-small">неизвесност или</text>
    <text x="1395" y="925" text-anchor="middle" class="agent-small">достигнуто ограничење</text>

    <!-- Три могућа исхода независне критике. -->
    <path d="M1395 637 V700 H1228 V911" class="flow-bus"/>
    <path d="M1228 755 H1245" class="flow"/>
    <path d="M1228 829 H1245" class="flow"/>
    <path d="M1228 911 H1245" class="flow"/>

    <!-- Једна јасна повратна путања, вођена уз ивице панела. -->
    <path d="M1245 844 H1210 V970 H535 V560 H570" class="repair"/>

    <!-- Прихваћени докази и неразрешива неизвесност завршавају контролисано. -->
    <path d="M1545 755 H1560 V995" class="flow-bus"/>
    <path d="M1545 911 H1560" class="flow-bus"/>
  </g>

  <!-- Синтеза -->
  <g id="synthesis">
    <rect x="30" y="1010" width="1540" height="155" rx="12" class="area"/>
    <rect x="30" y="1010" width="1540" height="42" rx="11" class="area-tab"/>
    <text x="50" y="1039" class="area-title">4. СИНТЕЗА И ЉУДСКА ОДЛУКА</text>

    <rect x="70" y="1070" width="390" height="78" rx="9" class="neutral"/>
    <text x="265" y="1117" text-anchor="middle" class="agent">Контролисано заустављање</text>

    <rect x="600" y="1070" width="400" height="78" rx="9" class="blue"/>
    <text x="800" y="1117" text-anchor="middle" class="agent">FinalDecisionSynthesisAgent</text>

    <rect x="1135" y="1070" width="395" height="78" rx="9" class="orange"/>
    <text x="1332.5" y="1105" text-anchor="middle" class="agent">Образложена прелиминарна</text>
    <text x="1332.5" y="1128" text-anchor="middle" class="agent">препорука</text>

    <path d="M460 1109 H600" class="flow"/>
    <path d="M1000 1109 H1135" class="flow"/>
    <path d="M1560 995 H265 V1070" class="flow"/>
  </g>

</svg>
