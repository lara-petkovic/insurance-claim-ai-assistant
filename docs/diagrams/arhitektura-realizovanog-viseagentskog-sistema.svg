<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title description">
  <title id="title">Архитектура реализованог вишеагентског система</title>
  <desc id="description">Контролисани централно оркестрирани вишеагентски ток са типизираним задацима, дозвољеним сервисима, заједничким стањем, лексичким проналажењем доказа, валидацијом и ограниченом поправком. Звездица означава агента који се активира условно, када је достављена слика оштећења.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#173b71" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#153f79"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2d8b69"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc7b1d"/>
    </marker>
    <style>
      .label, .sub-label, .group-title, .agent, .agent-long, .note, .legend, .white-label, .white-sub-label {
        font-family: Georgia, "Times New Roman", serif;
      }
      .label { font-size: 24px; font-weight: 700; fill: #153f79; }
      .sub-label { font-size: 18px; fill: #263b55; }
      .group-title { font-size: 19px; font-weight: 700; fill: #153f79; }
      .agent, .agent-long { font-size: 16px; font-weight: 700; fill: #28384c; }
      .note { font-size: 15px; fill: #40526a; }
      .repair-note { font-size: 17px; font-weight: 700; fill: #ad570d; }
      .legend { font-size: 16px; fill: #263b55; }
      .white-label { font-size: 24px; font-weight: 700; fill: #ffffff; }
      .white-sub-label { font-size: 18px; fill: #ffffff; }
      .box { fill: #ffffff; stroke: #6a7f9c; stroke-width: 1.5; }
      .blue-box { fill: #f8fbff; stroke: #496d9e; stroke-width: 1.8; }
      .green-box { fill: #f2fbf7; stroke: #2d8b69; stroke-width: 1.8; }
      .orange-box { fill: #fff8ef; stroke: #dc7b1d; stroke-width: 1.8; }
      .gray-box { fill: #f7f8fa; stroke: #7b8796; stroke-width: 1.6; }
      .orchestrator { fill: #173f79; stroke: #0f2f5d; stroke-width: 2; }
      .group { fill: #fbfdff; stroke: #7790b2; stroke-width: 1.5; }
      .optional { fill: #f6fbf8; stroke: #2d8b69; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .controlled-area { fill: none; stroke: #2d8b69; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .blue-line { fill: none; stroke: #153f79; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .green-line { fill: none; stroke: #2d8b69; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .state-line { fill: none; stroke: #2d8b69; stroke-width: 1.9; stroke-dasharray: 6 5; }
      .repair-line { fill: none; stroke: #dc7b1d; stroke-width: 2.4; stroke-dasharray: 8 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#ffffff"/>

  <!-- Улаз и заједничко стање -->
  <g filter="url(#shadow)">
    <rect x="600" y="24" width="600" height="72" rx="7" class="blue-box"/>
  </g>
  <g transform="translate(627 41)">
    <path d="M0 0 H22 L31 9 V39 H0 Z" fill="#173f79"/>
    <path d="M22 0 V9 H31" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M7 17 H24 M7 23 H24 M7 29 H20" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="900" y="69" text-anchor="middle" class="label">Кориснички захтев</text>

  <g filter="url(#shadow)">
    <rect x="1270" y="24" width="470" height="72" rx="7" class="green-box"/>
  </g>
  <text x="1505" y="54" text-anchor="middle" class="group-title">AgentContext / AnalysisRunState</text>
  <text x="1505" y="79" text-anchor="middle" class="sub-label">заједничко структурисано стање</text>

  <!-- Централна контрола -->
  <g filter="url(#shadow)">
    <rect x="60" y="130" width="470" height="90" rx="7" class="green-box"/>
  </g>
  <text x="295" y="182" text-anchor="middle" class="group-title">InvestigationPlannerAgent</text>

  <g filter="url(#shadow)">
    <rect x="600" y="130" width="600" height="90" rx="7" class="orchestrator"/>
  </g>
  <text x="900" y="166" text-anchor="middle" class="white-label">OrchestratorAgent</text>
  <text x="900" y="194" text-anchor="middle" class="white-sub-label">bounded execution graph</text>

  <g filter="url(#shadow)">
    <rect x="1270" y="130" width="470" height="90" rx="7" class="green-box"/>
  </g>
  <text x="1505" y="166" text-anchor="middle" class="group-title">ControlledServiceRegistry</text>
  <text x="1505" y="194" text-anchor="middle" class="sub-label">allow-listed сервиси</text>

  <!-- Једноставне контролне везе -->
  <path d="M900 96 V130" class="blue-line" marker-end="url(#arrow-blue)"/>
  <path d="M600 175 H530" class="blue-line" marker-end="url(#arrow-blue)"/>
  <path d="M1200 175 H1270" class="blue-line" marker-end="url(#arrow-blue)"/>
  <path d="M1270 60 H1235 V112 H1180 V130" class="state-line" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>

  <!-- Контролисана област -->
  <rect x="25" y="350" width="1750" height="475" rx="12" class="controlled-area"/>
  <rect x="45" y="329" width="620" height="43" fill="#ffffff"/>
  <text x="63" y="358" class="group-title">Контролисано извршавање над заједничким стањем</text>

  <!-- Контролна магистрала: оркестратор распоређује послове групама -->
  <path d="M900 220 V375" class="blue-line"/>
  <path d="M202 375 H1585" class="blue-line"/>
  <path d="M202 375 V400" class="blue-line" marker-end="url(#arrow-blue)"/>
  <path d="M542 375 V400" class="blue-line" marker-end="url(#arrow-blue)"/>
  <path d="M895 375 V400" class="blue-line" marker-end="url(#arrow-blue)"/>
  <path d="M1240 375 V400" class="blue-line" marker-end="url(#arrow-blue)"/>
  <path d="M1585 375 V400" class="blue-line" marker-end="url(#arrow-blue)"/>

  <!-- Обрада докумената -->
  <g filter="url(#shadow)">
    <rect x="45" y="400" width="315" height="335" rx="8" class="group"/>
  </g>
  <text x="202.5" y="433" text-anchor="middle" class="group-title">Обрада докумената</text>
  <rect x="53" y="456" width="299" height="52" rx="5" class="box"/>
  <rect x="53" y="522" width="299" height="52" rx="5" class="box"/>
  <rect x="53" y="588" width="299" height="52" rx="5" class="box"/>
  <rect x="53" y="654" width="299" height="52" rx="5" class="box"/>
  <text x="202.5" y="487" text-anchor="middle" class="agent">DocumentIngestionAgent</text>
  <text x="202.5" y="553" text-anchor="middle" class="agent">DocumentQualityAgent</text>
  <text x="202.5" y="619" text-anchor="middle" class="agent-long">PolicyConceptExtractionAgent</text>
  <text x="202.5" y="685" text-anchor="middle" class="agent">ClaimExtractionAgent</text>

  <!-- Функционалне смернице -->
  <g filter="url(#shadow)">
    <rect x="385" y="400" width="315" height="335" rx="8" class="group"/>
  </g>
  <text x="542.5" y="433" text-anchor="middle" class="group-title">Функционалне смернице</text>
  <rect x="393" y="456" width="299" height="52" rx="5" class="box"/>
  <rect x="393" y="522" width="299" height="52" rx="5" class="box"/>
  <rect x="393" y="588" width="299" height="52" rx="5" class="box"/>
  <rect x="393" y="654" width="299" height="52" rx="5" class="box"/>
  <text x="542.5" y="487" text-anchor="middle" class="agent-long">GeneralInsuranceFunctionalAgent</text>
  <text x="542.5" y="553" text-anchor="middle" class="agent-long">HomeInsuranceFunctionalAgent</text>
  <text x="542.5" y="619" text-anchor="middle" class="agent-long">AutoInsuranceFunctionalAgent</text>
  <text x="542.5" y="685" text-anchor="middle" class="agent-long">TravelInsuranceFunctionalAgent</text>

  <!-- Retrieval и докази -->
  <g filter="url(#shadow)">
    <rect x="725" y="400" width="340" height="335" rx="8" class="group"/>
  </g>
  <text x="895" y="433" text-anchor="middle" class="group-title">Retrieval и докази</text>
  <rect x="749" y="456" width="292" height="45" rx="5" class="box"/>
  <rect x="749" y="509" width="292" height="45" rx="5" class="box"/>
  <rect x="749" y="562" width="292" height="45" rx="5" class="box"/>
  <rect x="749" y="615" width="292" height="45" rx="5" class="optional"/>
  <rect x="749" y="668" width="292" height="45" rx="5" class="optional"/>
  <text x="895" y="484" text-anchor="middle" class="agent">QueryRewriteAgent</text>
  <text x="895" y="537" text-anchor="middle" class="agent">RetrievalAgent</text>
  <text x="895" y="590" text-anchor="middle" class="agent">CitationAgent</text>
  <text x="770" y="643" class="agent" fill="#2d8b69">★</text>
  <text x="895" y="643" text-anchor="middle" class="agent">VisualEvidenceAgent</text>
  <text x="770" y="696" class="agent" fill="#2d8b69">★</text>
  <text x="895" y="696" text-anchor="middle" class="agent">ImageAuthenticityAgent</text>

  <!-- Анализа покрића -->
  <g filter="url(#shadow)">
    <rect x="1090" y="400" width="300" height="335" rx="8" class="group"/>
  </g>
  <text x="1240" y="433" text-anchor="middle" class="group-title">Анализа покрића</text>
  <rect x="1114" y="456" width="252" height="58" rx="6" class="green-box"/>
  <rect x="1114" y="552" width="252" height="58" rx="5" class="box"/>
  <rect x="1114" y="648" width="252" height="58" rx="5" class="box"/>
  <text x="1240" y="491" text-anchor="middle" class="agent">CoverageAnalystAgent</text>
  <text x="1240" y="587" text-anchor="middle" class="agent">CoverageMatchingAgent</text>
  <text x="1240" y="683" text-anchor="middle" class="agent">ExclusionCheckingAgent</text>
  <path d="M1240 514 V552" class="green-line" marker-end="url(#arrow-green)"/>
  <path d="M1240 610 V648" class="green-line" marker-end="url(#arrow-green)"/>

  <!-- Провера и критика -->
  <g filter="url(#shadow)">
    <rect x="1415" y="400" width="340" height="335" rx="8" class="group"/>
  </g>
  <text x="1585" y="433" text-anchor="middle" class="group-title">Провера и критика</text>
  <rect x="1439" y="456" width="292" height="52" rx="5" class="box"/>
  <rect x="1439" y="522" width="292" height="52" rx="5" class="box"/>
  <rect x="1439" y="588" width="292" height="52" rx="6" class="orange-box"/>
  <rect x="1439" y="654" width="292" height="52" rx="5" class="box"/>
  <text x="1585" y="487" text-anchor="middle" class="agent">MissingDocumentsAgent</text>
  <text x="1585" y="553" text-anchor="middle" class="agent-long">ConsistencyVerificationAgent</text>
  <text x="1585" y="619" text-anchor="middle" class="agent">EvidenceCriticAgent</text>
  <text x="1585" y="685" text-anchor="middle" class="agent">OutputValidatorAgent</text>

  <!-- Делимично унапред дефинисан ток зависности -->
  <path d="M360 568 H385" class="green-line" marker-end="url(#arrow-green)"/>
  <path d="M700 568 H725" class="green-line" marker-end="url(#arrow-green)"/>
  <path d="M1065 568 H1090" class="green-line" marker-end="url(#arrow-green)"/>
  <path d="M1390 568 H1415" class="green-line" marker-end="url(#arrow-green)"/>

  <!-- Циљана поправка: од критичара назад на retrieval -->
  <path d="M1439 614 H1402 V802 H1385" class="repair-line"/>
  <rect x="1000" y="781" width="385" height="42" rx="5" fill="#ffffff"/>
  <text x="1192.5" y="808" text-anchor="middle" class="repair-note">циљана поправка – највише 2 итерације</text>
  <path d="M1000 802 H895 V735" class="repair-line" marker-end="url(#arrow-orange)"/>

  <!-- Синтеза и исход -->
  <g filter="url(#shadow)">
    <rect x="500" y="855" width="750" height="70" rx="7" class="blue-box"/>
  </g>
  <text x="875" y="899" text-anchor="middle" class="label">FinalDecisionSynthesisAgent</text>
  <path d="M875 825 V855" class="blue-line" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="1415" y="850" width="340" height="80" rx="7" class="gray-box"/>
  </g>
  <text x="1585" y="883" text-anchor="middle" class="group-title">Контролисано заустављање</text>
  <text x="1585" y="909" text-anchor="middle" class="note">докази • неизвесност • буџет • грешка</text>
  <path d="M1585 735 V850" class="blue-line" marker-end="url(#arrow-blue)"/>

  <!-- Прелиминарна препорука -->
  <g filter="url(#shadow)">
    <rect x="420" y="960" width="910" height="88" rx="8" class="orange-box"/>
  </g>
  <path d="M875 925 V960" class="blue-line" marker-end="url(#arrow-blue)"/>
  <text x="875" y="996" text-anchor="middle" class="label" fill="#a9530b">Образложена прелиминарна препорука</text>
  <text x="875" y="1026" text-anchor="middle" class="sub-label">human-in-the-loop • подршка људској одлуци</text>

  <!-- Сажета легенда -->
  <g transform="translate(1380 935)">
    <rect x="0" y="0" width="375" height="135" rx="7" class="box"/>
    <path d="M20 20 H78" class="blue-line" marker-end="url(#arrow-blue)"/>
    <text x="94" y="25" class="legend">контролисани ток</text>
    <path d="M20 45 H78" class="green-line" marker-end="url(#arrow-green)"/>
    <text x="94" y="50" class="legend">зависност задатака</text>
    <path d="M20 70 H78" class="state-line" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
    <text x="94" y="75" class="legend">заједничко стање</text>
    <path d="M20 95 H78" class="repair-line" marker-end="url(#arrow-orange)"/>
    <text x="94" y="100" class="legend">ограничена поправка</text>
    <text x="44" y="125" text-anchor="middle" class="legend" fill="#2d8b69">★</text>
    <text x="94" y="125" class="legend">условно активиран агент</text>
  </g>
</svg>
