<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2900" viewBox="0 0 1900 2900" role="img" aria-labelledby="description">
  <desc id="description">UML дијаграм Pydantic модела за систем анализе захтева за осигурање.</desc>
  <defs>
    <marker id="diamond" markerWidth="18" markerHeight="14" refX="5" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 7 L 5 2 L 10 7 L 5 12 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 10 6 L 1 11 Z" fill="#000000"/>
    </marker>
    <style>
      .box { fill: #ecf3fb; stroke: #0e3c75; stroke-width: 2; rx: 8; }
      .head-input, .head-output, .head-agent, .head-value { fill: #0e3c75; }
      .enum-box { fill: #e9f5f3; stroke: #2a7f75; stroke-width: 2; rx: 8; }
      .enum-head { fill: #2a7f75; }
      .class-name { font-family: "Courier New", Courier, monospace; font-size: 35px; font-weight: 700; fill: #ffffff; }
      .field { font-family: "Courier New", Courier, monospace; font-size: 30px; fill: #243b53; }
      .enum-field { font-family: "Courier New", Courier, monospace; font-size: 28px; fill: #174c47; }
      .field-note { font-family: "Courier New", Courier, monospace; font-size: 25px; fill: #627d98; }
      .divider { stroke: #0e3c75; stroke-width: 1.4; }
      .relation { fill: none; stroke: #000000; stroke-width: 2.1; marker-start: url(#diamond); marker-end: url(#arrow); }
      .cardinality { font-family: "Courier New", Courier, monospace; font-size: 30px; font-weight: 700; fill: #243b53; paint-order: stroke; stroke: #ffffff; stroke-width: 5; }
    </style>
  </defs>

  <rect width="1900" height="2900" fill="#ffffff"/>

  <!-- ClaimRequestData -->
  <g transform="translate(50 50)">
    <rect class="box" width="1000" height="560"/>
    <path class="head-input" d="M12 0 H988 Q1000 0 1000 12 V70 H0 V12 Q0 0 12 0 Z"/>
    <text x="500" y="44" text-anchor="middle" class="class-name">ClaimRequestData</text>
    <line x1="0" y1="70" x2="1000" y2="70" class="divider"/>
    <text x="22" y="105" class="field">+ insurance_type: str = "home"</text>
    <text x="22" y="142" class="field">+ claim_description: str</text>
    <text x="22" y="179" class="field">+ incident_date: str | None</text>
    <text x="22" y="216" class="field">+ policy_text: str</text>
    <text x="22" y="253" class="field">+ policy_filename: str | None</text>
    <text x="22" y="290" class="field">+ policy_extraction_warnings: list[str]</text>
    <text x="22" y="327" class="field">+ supporting_documents: list[SupportingDocumentData]</text>
    <text x="22" y="364" class="field">+ damage_image_filename: str | None</text>
    <text x="22" y="401" class="field">+ damage_image_size: int | None</text>
    <text x="22" y="438" class="field">+ damage_image_mime_type: str | None</text>
    <text x="22" y="475" class="field">+ damage_image_bytes: bytes | None</text>
    <text x="22" y="512" class="field">+ security_flags: list[str]</text>
  </g>

  <!-- SupportingDocumentData -->
  <g transform="translate(1180 135)">
    <rect class="box" width="650" height="285"/>
    <path class="head-value" d="M12 0 H638 Q650 0 650 12 V70 H0 V12 Q0 0 12 0 Z"/>
    <text x="325" y="44" text-anchor="middle" class="class-name">SupportingDocumentData</text>
    <line x1="0" y1="70" x2="650" y2="70" class="divider"/>
    <text x="20" y="105" class="field">+ filename: str</text>
    <text x="20" y="142" class="field">+ document_type: str</text>
    <text x="20" y="179" class="field">+ text: str</text>
    <text x="20" y="216" class="field">+ extraction_warnings: list[str]</text>
    <text x="20" y="253" class="field">+ text_length: int</text>
  </g>

  <!-- ClaimAnalysisResult -->
  <g transform="translate(50 760)">
    <rect class="box" width="900" height="625"/>
    <path class="head-output" d="M12 0 H888 Q900 0 900 12 V70 H0 V12 Q0 0 12 0 Z"/>
    <text x="450" y="44" text-anchor="middle" class="class-name">ClaimAnalysisResult</text>
    <line x1="0" y1="70" x2="900" y2="70" class="divider"/>
    <text x="22" y="105" class="field">+ claim_status: ClaimStatus</text>
    <text x="22" y="142" class="field">+ insurance_type: str</text>
    <text x="22" y="179" class="field">+ claim_type: str</text>
    <text x="22" y="216" class="field">+ coverage_assessment: CoverageAssessment</text>
    <text x="22" y="253" class="field">+ matched_policy_concepts: list[dict[str, Any]]</text>
    <text x="22" y="290" class="field">+ potential_exclusions: list[dict[str, Any]]</text>
    <text x="22" y="327" class="field">+ missing_documents: list[str]</text>
    <text x="22" y="364" class="field">+ image_assessment: ImageAssessment</text>
    <text x="22" y="401" class="field">+ image_authenticity: ImageAuthenticity</text>
    <text x="22" y="438" class="field">+ evidence: list[EvidenceItem]</text>
    <text x="22" y="475" class="field">+ reasoning_summary: str</text>
    <text x="22" y="512" class="field">+ recommendation: str</text>
    <text x="22" y="549" class="field">+ security_flags: list[str]</text>
    <text x="22" y="586" class="field">+ agent_trace: list[AgentResponse]</text>
  </g>

  <!-- Enumerations -->
  <g transform="translate(50 2140)">
    <rect class="enum-box" width="500" height="230"/>
    <path class="enum-head" d="M8 0 H492 Q500 0 500 8 V60 H0 V8 Q0 0 8 0 Z"/>
    <text x="250" y="40" text-anchor="middle" class="class-name">ClaimStatus</text>
    <line x1="0" y1="60" x2="500" y2="60" stroke="#2a7f75" stroke-width="1.4"/>
    <text x="18" y="94" class="enum-field">LIKELY_COVERED</text>
    <text x="18" y="128" class="enum-field">LIKELY_NOT_COVERED</text>
    <text x="18" y="162" class="enum-field">PARTIALLY_COVERED</text>
    <text x="18" y="196" class="enum-field">REQUIRES_HUMAN_REVIEW</text>
  </g>

  <g transform="translate(600 2140)">
    <rect class="enum-box" width="500" height="230"/>
    <path class="enum-head" d="M8 0 H492 Q500 0 500 8 V60 H0 V8 Q0 0 8 0 Z"/>
    <text x="250" y="40" text-anchor="middle" class="class-name">CoverageAssessment</text>
    <line x1="0" y1="60" x2="500" y2="60" stroke="#2a7f75" stroke-width="1.4"/>
    <text x="18" y="94" class="enum-field">COVERED</text>
    <text x="18" y="128" class="enum-field">NOT_COVERED</text>
    <text x="18" y="162" class="enum-field">POSSIBLY_COVERED</text>
    <text x="18" y="196" class="enum-field">UNCLEAR</text>
  </g>

  <g transform="translate(1150 2140)">
    <rect class="enum-box" width="500" height="230"/>
    <path class="enum-head" d="M8 0 H492 Q500 0 500 8 V60 H0 V8 Q0 0 8 0 Z"/>
    <text x="250" y="40" text-anchor="middle" class="class-name">AgentStatus</text>
    <line x1="0" y1="60" x2="500" y2="60" stroke="#2a7f75" stroke-width="1.4"/>
    <text x="18" y="94" class="enum-field">COMPLETED</text>
    <text x="18" y="128" class="enum-field">WARNING</text>
    <text x="18" y="162" class="enum-field">FAILED</text>
    <text x="18" y="196" class="enum-field">SKIPPED</text>
  </g>

  <g transform="translate(50 2450)">
    <rect class="enum-box" width="500" height="270"/>
    <path class="enum-head" d="M8 0 H492 Q500 0 500 8 V60 H0 V8 Q0 0 8 0 Z"/>
    <text x="250" y="40" text-anchor="middle" class="class-name">AgentType</text>
    <line x1="0" y1="60" x2="500" y2="60" stroke="#2a7f75" stroke-width="1.4"/>
    <text x="18" y="94" class="enum-field">ORCHESTRATOR</text>
    <text x="18" y="128" class="enum-field">TECHNICAL</text>
    <text x="18" y="162" class="enum-field">FUNCTIONAL</text>
    <text x="18" y="196" class="enum-field">VALIDATOR</text>
    <text x="18" y="230" class="enum-field">SYNTHESIS</text>
  </g>

  <g transform="translate(600 2450)">
    <rect class="enum-box" width="500" height="330"/>
    <path class="enum-head" d="M8 0 H492 Q500 0 500 8 V60 H0 V8 Q0 0 8 0 Z"/>
    <text x="250" y="40" text-anchor="middle" class="class-name">MessageType</text>
    <line x1="0" y1="60" x2="500" y2="60" stroke="#2a7f75" stroke-width="1.4"/>
    <text x="18" y="94" class="enum-field">HANDOFF</text>
    <text x="18" y="128" class="enum-field">REQUEST</text>
    <text x="18" y="162" class="enum-field">RESPONSE</text>
    <text x="18" y="196" class="enum-field">GUIDANCE</text>
    <text x="18" y="230" class="enum-field">FEEDBACK</text>
    <text x="18" y="264" class="enum-field">VALIDATION</text>
    <text x="18" y="298" class="enum-field">SUMMARY</text>
  </g>

  <g transform="translate(1150 2450)">
    <rect class="enum-box" width="500" height="230"/>
    <path class="enum-head" d="M8 0 H492 Q500 0 500 8 V60 H0 V8 Q0 0 8 0 Z"/>
    <text x="250" y="40" text-anchor="middle" class="class-name">RiskLevel</text>
    <line x1="0" y1="60" x2="500" y2="60" stroke="#2a7f75" stroke-width="1.4"/>
    <text x="18" y="94" class="enum-field">LOW</text>
    <text x="18" y="128" class="enum-field">MEDIUM</text>
    <text x="18" y="162" class="enum-field">HIGH</text>
    <text x="18" y="196" class="enum-field">REQUIRES_HUMAN_REVIEW</text>
  </g>

  <!-- ImageAssessment -->
  <g transform="translate(1180 780)">
    <rect class="box" width="600" height="225"/>
    <path class="head-value" d="M12 0 H588 Q600 0 600 12 V65 H0 V12 Q0 0 12 0 Z"/>
    <text x="300" y="42" text-anchor="middle" class="class-name">ImageAssessment</text>
    <line x1="0" y1="65" x2="600" y2="65" class="divider"/>
    <text x="20" y="105" class="field">+ detected_damage: str</text>
    <text x="20" y="145" class="field">+ confidence: float</text>
    <text x="20" y="185" class="field">+ notes: list[str]</text>
  </g>

  <!-- ImageAuthenticity -->
  <g transform="translate(1180 1080)">
    <rect class="box" width="600" height="225"/>
    <path class="head-value" d="M12 0 H588 Q600 0 600 12 V65 H0 V12 Q0 0 12 0 Z"/>
    <text x="300" y="42" text-anchor="middle" class="class-name">ImageAuthenticity</text>
    <line x1="0" y1="65" x2="600" y2="65" class="divider"/>
    <text x="20" y="105" class="field">+ risk_level: RiskLevel</text>
    <text x="20" y="145" class="field">+ risk_score: float</text>
    <text x="20" y="185" class="field">+ signals: list[str]</text>
  </g>

  <!-- AgentResponse -->
  <g transform="translate(50 1480)">
    <rect class="box" width="720" height="440"/>
    <path class="head-agent" d="M12 0 H708 Q720 0 720 12 V70 H0 V12 Q0 0 12 0 Z"/>
    <text x="360" y="44" text-anchor="middle" class="class-name">AgentResponse</text>
    <line x1="0" y1="70" x2="720" y2="70" class="divider"/>
    <text x="22" y="105" class="field">+ agent_name: str</text>
    <text x="22" y="142" class="field">+ agent_type: AgentType</text>
    <text x="22" y="179" class="field">+ status: AgentStatus</text>
    <text x="22" y="216" class="field">+ findings: dict[str, Any]</text>
    <text x="22" y="253" class="field">+ evidence: list[EvidenceItem]</text>
    <text x="22" y="290" class="field">+ confidence: float</text>
    <text x="22" y="327" class="field">+ warnings: list[str]</text>
    <text x="22" y="364" class="field">+ requires_human_review: bool</text>
    <text x="22" y="401" class="field">+ messages: list[AgentMessage]</text>
  </g>

  <!-- EvidenceItem -->
  <g transform="translate(1180 1450)">
    <rect class="box" width="600" height="285"/>
    <path class="head-value" d="M12 0 H588 Q600 0 600 12 V65 H0 V12 Q0 0 12 0 Z"/>
    <text x="300" y="42" text-anchor="middle" class="class-name">EvidenceItem</text>
    <line x1="0" y1="65" x2="600" y2="65" class="divider"/>
    <text x="20" y="100" class="field">+ source: str</text>
    <text x="20" y="138" class="field">+ text: str</text>
    <text x="20" y="176" class="field">+ section: str | None</text>
    <text x="20" y="214" class="field">+ page: int | None</text>
    <text x="20" y="252" class="field">+ score: float | None</text>
  </g>

  <!-- AgentMessage -->
  <g transform="translate(1180 1795)">
    <rect class="box" width="650" height="290"/>
    <path class="head-value" d="M12 0 H638 Q650 0 650 12 V65 H0 V12 Q0 0 12 0 Z"/>
    <text x="325" y="42" text-anchor="middle" class="class-name">AgentMessage</text>
    <line x1="0" y1="65" x2="650" y2="65" class="divider"/>
    <text x="20" y="100" class="field">+ from_agent: str</text>
    <text x="20" y="138" class="field">+ to_agent: str | None</text>
    <text x="20" y="176" class="field">+ message_type: MessageType</text>
    <text x="20" y="214" class="field">+ content: str</text>
    <text x="20" y="252" class="field">+ metadata: dict[str, Any]</text>
  </g>

  <!-- Relations -->
  <path d="M1050 270 H1180" class="relation"/>
  <text x="1070" y="248" class="cardinality">1</text>
  <text x="1120" y="248" class="cardinality">0..*</text>

  <path d="M950 880 H1110 V890 H1180" class="relation"/>
  <text x="965" y="862" class="cardinality">1</text>
  <text x="1140" y="868" class="cardinality">1</text>

  <path d="M950 1190 H1180" class="relation"/>
  <text x="970" y="1172" class="cardinality">1</text>
  <text x="1145" y="1168" class="cardinality">1</text>

  <path d="M950 1260 H1110 V1550 H1180" class="relation"/>
  <text x="965" y="1242" class="cardinality">1</text>
  <text x="1115" y="1528" class="cardinality">0..*</text>

  <path d="M500 1385 V1480" class="relation"/>
  <text x="515" y="1420" class="cardinality">1</text>
  <text x="515" y="1465" class="cardinality">0..*</text>

  <path d="M770 1600 H1180" class="relation"/>
  <text x="790" y="1582" class="cardinality">1</text>
  <text x="1115" y="1578" class="cardinality">0..*</text>

  <path d="M770 1780 H1080 V1940 H1180" class="relation"/>
  <text x="790" y="1762" class="cardinality">1</text>
  <text x="1115" y="1918" class="cardinality">0..*</text>

</svg>
