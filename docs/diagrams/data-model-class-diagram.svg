<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2200" viewBox="0 0 2400 2200" role="img" aria-labelledby="description">
  <desc id="description">UML dijagram javnih modela zahteva i rezultata, dokumenata i agentskog traga, sa agregacionim vezama i kardinalnostima.</desc>
  <defs>
    <marker id="inheritance" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L14,7 L1,13 Z" fill="#ffffff" stroke="#2D8B69" stroke-width="2"/>
    </marker>
    <marker id="aggregation" markerWidth="16" markerHeight="14" refX="4" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,7 L5,2 L10,7 L5,12 Z" fill="#ffffff" stroke="#173F79" stroke-width="1.7"/>
    </marker>
    <marker id="composition" markerWidth="16" markerHeight="14" refX="4" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,7 L5,2 L10,7 L5,12 Z" fill="#173F79" stroke="#173F79" stroke-width="1.5"/>
    </marker>
    <marker id="nav-arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6.5 L1,12 Z" fill="#173F79"/>
    </marker>
    <style>
      .canvas{fill:#fff}.section{fill:#fff;stroke:#AEB8C5;stroke-width:2.5;rx:18}
      .class-box{fill:#F7FAFD;stroke:#173F79;stroke-width:2.5;rx:12}.document-box{fill:#F5FBF8;stroke:#2D8B69;stroke-width:2.5;rx:12}.support-box{fill:#FAFAFA;stroke:#6B7280;stroke-width:2.5;rx:12}
      .header-blue{fill:#173F79}.header-green{fill:#2D8B69}.header-gray{fill:#5F6874}
      .class-name{font-family:Georgia,"Times New Roman",serif;font-size:35px;font-weight:700;fill:#fff}
      .field{font-family:"Courier New",Consolas,monospace;font-size:27px;fill:#223247}.field-small{font-family:"Courier New",Consolas,monospace;font-size:25px;fill:#223247}
      .divider-blue{stroke:#173F79;stroke-width:1.6}.divider-green{stroke:#2D8B69;stroke-width:1.6}.divider-gray{stroke:#6B7280;stroke-width:1.6}
      .inheritance{fill:none;stroke:#2D8B69;stroke-width:2.5;marker-end:url(#inheritance)}.tree{fill:none;stroke:#2D8B69;stroke-width:2.5}
      .association{fill:none;stroke:#173F79;stroke-width:2.4;marker-start:url(#aggregation);marker-end:url(#nav-arrow)}
      .composition-link{fill:none;stroke:#173F79;stroke-width:2.4;marker-start:url(#composition);marker-end:url(#nav-arrow)}
      .multiplicity{font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:700;fill:#173F79;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="2400" height="2200"/>

  <!-- Zahtev i dokumenti -->
  <rect x="28" y="28" width="2344" height="890" class="section"/>

  <g aria-label="ClaimRequestData">
    <rect x="68" y="68" width="930" height="610" class="class-box"/>
    <path d="M80 68 H986 Q998 68 998 80 V140 H68 V80 Q68 68 80 68 Z" class="header-blue"/>
    <text x="533" y="113" text-anchor="middle" class="class-name">ClaimRequestData</text>
    <line x1="68" y1="140" x2="998" y2="140" class="divider-blue"/>
    <text x="92" y="178" class="field-small">+ insurance_type: InsuranceType</text>
    <text x="92" y="210" class="field-small">+ claim_description: str</text>
    <text x="92" y="242" class="field-small">+ incident_date: str | None</text>
    <text x="92" y="274" class="field-small">+ policy_text: str</text>
    <text x="92" y="306" class="field-small">+ policy_filename: str | None</text>
    <text x="92" y="338" class="field-small">+ policy_extraction_warnings: list[str]</text>
    <text x="92" y="370" class="field-small">+ policy_document: PolicyDocument | None</text>
    <text x="92" y="402" class="field-small">+ damage_image_filename: str | None</text>
    <text x="92" y="434" class="field-small">+ damage_image_size: int | None</text>
    <text x="92" y="466" class="field-small">+ damage_image_mime_type: str | None</text>
    <text x="92" y="498" class="field-small">+ damage_image_bytes: bytes | None</text>
    <text x="92" y="530" class="field-small">+ supporting_documents:</text>
    <text x="122" y="562" class="field-small">list[SupportingDocumentData]</text>
    <text x="92" y="594" class="field-small">+ security_flags: list[str]</text>
  </g>

  <g aria-label="SourceDocument">
    <rect x="1098" y="68" width="620" height="390" class="document-box"/>
    <path d="M1110 68 H1706 Q1718 68 1718 80 V140 H1098 V80 Q1098 68 1110 68 Z" class="header-green"/>
    <text x="1408" y="113" text-anchor="middle" class="class-name">SourceDocument</text>
    <line x1="1098" y1="140" x2="1718" y2="140" class="divider-green"/>
    <text x="1122" y="178" class="field-small">+ document_id: str</text>
    <text x="1122" y="210" class="field-small">+ filename: str</text>
    <text x="1122" y="242" class="field-small">+ document_type: str</text>
    <text x="1122" y="274" class="field-small">+ text: str</text>
    <text x="1122" y="306" class="field-small">+ pages: list[DocumentPage]</text>
    <text x="1122" y="338" class="field-small">+ extraction_method: ExtractionMethod</text>
    <text x="1122" y="370" class="field-small">+ extraction_warnings: list[str]</text>
    <text x="1122" y="402" class="field-small">+ text_length: int</text>
  </g>

  <g aria-label="DocumentPage">
    <rect x="1798" y="68" width="534" height="280" class="document-box"/>
    <path d="M1810 68 H2320 Q2332 68 2332 80 V140 H1798 V80 Q1798 68 1810 68 Z" class="header-green"/>
    <text x="2065" y="113" text-anchor="middle" class="class-name">DocumentPage</text>
    <line x1="1798" y1="140" x2="2332" y2="140" class="divider-green"/>
    <text x="1822" y="178" class="field-small">+ page_number: int</text>
    <text x="1822" y="210" class="field-small">+ text: str</text>
    <text x="1822" y="242" class="field-small">+ char_start: int</text>
    <text x="1822" y="274" class="field-small">+ char_end: int</text>
    <text x="1822" y="306" class="field-small">+ extraction_method: ExtractionMethod</text>
  </g>

  <g aria-label="PolicyDocument">
    <rect x="1058" y="540" width="360" height="175" class="document-box"/>
    <path d="M1070 540 H1406 Q1418 540 1418 552 V612 H1058 V552 Q1058 540 1070 540 Z" class="header-green"/>
    <text x="1238" y="585" text-anchor="middle" class="class-name" style="font-size:31px">PolicyDocument</text>
    <line x1="1058" y1="612" x2="1418" y2="612" class="divider-green"/>
    <text x="1238" y="650" text-anchor="middle" class="field-small">document_type:</text>
    <text x="1238" y="684" text-anchor="middle" class="field-small">Literal["policy"]</text>
  </g>

  <g aria-label="SupportingDocument">
    <rect x="1478" y="540" width="430" height="72" class="document-box"/>
    <path d="M1490 540 H1896 Q1908 540 1908 552 V612 H1478 V552 Q1478 540 1490 540 Z" class="header-green"/>
    <text x="1693" y="585" text-anchor="middle" class="class-name" style="font-size:30px">SupportingDocument</text>
  </g>

  <g aria-label="SupportingDocumentData">
    <rect x="1433" y="800" width="520" height="72" class="class-box"/>
    <path d="M1445 800 H1941 Q1953 800 1953 812 V872 H1433 V812 Q1433 800 1445 800 Z" class="header-blue"/>
    <text x="1693" y="845" text-anchor="middle" class="class-name" style="font-size:29px">SupportingDocumentData</text>
  </g>

  <!-- Nasledjivanje i sadrzaj dokumenta -->
  <path d="M1718 220 H1758 V300 H1798" class="composition-link"/>
  <text x="1728" y="204" class="multiplicity">1</text>
  <text x="1728" y="290" class="multiplicity">0..*</text>
  <path d="M1238 540 V505 H1693" class="tree"/>
  <path d="M1693 540 V505" class="tree"/>
  <path d="M1408 505 V458" class="inheritance"/>
  <path d="M1693 800 V612" class="inheritance"/>

  <!-- Agregacije zahteva -->
  <path d="M998 510 H1028 V628 H1058" class="association"/>
  <text x="1008" y="495" class="multiplicity">1</text>
  <text x="1015" y="658" class="multiplicity">0..1</text>
  <path d="M800 678 V836 H1433" class="association"/>
  <text x="814" y="714" class="multiplicity">1</text>
  <text x="1368" y="821" class="multiplicity">0..*</text>

  <!-- Rezultat i agentski trag -->
  <rect x="28" y="950" width="2344" height="1210" class="section"/>

  <g aria-label="ClaimAnalysisResult">
    <rect x="68" y="990" width="930" height="700" class="class-box"/>
    <path d="M80 990 H986 Q998 990 998 1002 V1062 H68 V1002 Q68 990 80 990 Z" class="header-blue"/>
    <text x="533" y="1035" text-anchor="middle" class="class-name">ClaimAnalysisResult</text>
    <line x1="68" y1="1062" x2="998" y2="1062" class="divider-blue"/>
    <text x="92" y="1098" class="field-small">+ claim_status: ClaimStatus</text>
    <text x="92" y="1129" class="field-small">+ insurance_type: InsuranceType</text>
    <text x="92" y="1160" class="field-small">+ claim_type: str</text>
    <text x="92" y="1191" class="field-small">+ coverage_assessment: CoverageAssessment</text>
    <text x="92" y="1222" class="field-small">+ matched_policy_concepts: list[dict[str, Any]]</text>
    <text x="92" y="1253" class="field-small">+ potential_exclusions: list[dict[str, Any]]</text>
    <text x="92" y="1284" class="field-small">+ missing_documents: list[str]</text>
    <text x="92" y="1315" class="field-small">+ image_assessment: ImageAssessment</text>
    <text x="92" y="1346" class="field-small">+ image_authenticity: ImageAuthenticity</text>
    <text x="92" y="1377" class="field-small">+ evidence: list[EvidenceItem]</text>
    <text x="92" y="1408" class="field-small">+ claim_facts: list[ClaimFact]</text>
    <text x="92" y="1439" class="field-small">+ policy_clauses: list[PolicyClause]</text>
    <text x="92" y="1470" class="field-small">+ assessment_propositions:</text>
    <text x="122" y="1501" class="field-small">list[AssessmentProposition]</text>
    <text x="92" y="1532" class="field-small">+ reasoning_summary: str</text>
    <text x="92" y="1563" class="field-small">+ recommendation: str</text>
    <text x="92" y="1594" class="field-small">+ security_flags: list[str]</text>
    <text x="92" y="1625" class="field-small">+ orchestration: OrchestrationSummary</text>
    <text x="92" y="1656" class="field-small">+ agent_trace: list[AgentResponse]</text>
  </g>

  <g aria-label="ImageAssessment">
    <rect x="1078" y="990" width="480" height="200" class="support-box"/>
    <path d="M1090 990 H1546 Q1558 990 1558 1002 V1062 H1078 V1002 Q1078 990 1090 990 Z" class="header-gray"/>
    <text x="1318" y="1035" text-anchor="middle" class="class-name" style="font-size:29px">ImageAssessment</text>
    <line x1="1078" y1="1062" x2="1558" y2="1062" class="divider-gray"/>
    <text x="1102" y="1100" class="field-small">+ detected_damage: str</text>
    <text x="1102" y="1132" class="field-small">+ confidence: float</text>
    <text x="1102" y="1164" class="field-small">+ notes: list[str]</text>
  </g>

  <g aria-label="ImageAuthenticity">
    <rect x="1078" y="1230" width="480" height="200" class="support-box"/>
    <path d="M1090 1230 H1546 Q1558 1230 1558 1242 V1302 H1078 V1242 Q1078 1230 1090 1230 Z" class="header-gray"/>
    <text x="1318" y="1275" text-anchor="middle" class="class-name" style="font-size:28px">ImageAuthenticity</text>
    <line x1="1078" y1="1302" x2="1558" y2="1302" class="divider-gray"/>
    <text x="1102" y="1340" class="field-small">+ risk_level: RiskLevel</text>
    <text x="1102" y="1372" class="field-small">+ risk_score: float</text>
    <text x="1102" y="1404" class="field-small">+ signals: list[str]</text>
  </g>

  <g aria-label="EvidenceItem">
    <rect x="1638" y="990" width="694" height="590" class="document-box"/>
    <path d="M1650 990 H2320 Q2332 990 2332 1002 V1062 H1638 V1002 Q1638 990 1650 990 Z" class="header-green"/>
    <text x="1985" y="1035" text-anchor="middle" class="class-name">EvidenceItem</text>
    <line x1="1638" y1="1062" x2="2332" y2="1062" class="divider-green"/>
    <text x="1662" y="1098" class="field-small">+ source: str</text>
    <text x="1662" y="1129" class="field-small">+ text: str</text>
    <text x="1662" y="1160" class="field-small">+ section: str | None</text>
    <text x="1662" y="1191" class="field-small">+ page: int | None</text>
    <text x="1662" y="1222" class="field-small">+ score: float | None</text>
    <text x="1662" y="1253" class="field-small">+ source_document_id: str | None</text>
    <text x="1662" y="1284" class="field-small">+ source_filename: str | None</text>
    <text x="1662" y="1315" class="field-small">+ section_heading: str | None</text>
    <text x="1662" y="1346" class="field-small">+ char_start / char_end: int | None</text>
    <text x="1662" y="1377" class="field-small">+ stable_location: str | None</text>
    <text x="1662" y="1408" class="field-small">+ extraction_method: str | None</text>
    <text x="1662" y="1439" class="field-small">+ verification_status: str | None</text>
    <text x="1662" y="1470" class="field-small">+ policy_clause_id: str | None</text>
    <text x="1662" y="1501" class="field-small">+ clause_type: str | None</text>
    <text x="1662" y="1532" class="field-small">+ proposition_ids: list[str]</text>
  </g>

  <g aria-label="AgentResponse">
    <rect x="1078" y="1640" width="650" height="390" class="class-box"/>
    <path d="M1090 1640 H1716 Q1728 1640 1728 1652 V1712 H1078 V1652 Q1078 1640 1090 1640 Z" class="header-blue"/>
    <text x="1403" y="1685" text-anchor="middle" class="class-name">AgentResponse</text>
    <line x1="1078" y1="1712" x2="1728" y2="1712" class="divider-blue"/>
    <text x="1102" y="1748" class="field-small">+ agent_name: str</text>
    <text x="1102" y="1778" class="field-small">+ agent_type: AgentType</text>
    <text x="1102" y="1808" class="field-small">+ status: AgentStatus</text>
    <text x="1102" y="1838" class="field-small">+ findings:</text>
    <text x="1132" y="1868" class="field-small">SerializeAsAny[AgentFindings]</text>
    <text x="1102" y="1898" class="field-small">+ evidence: list[EvidenceItem]</text>
    <text x="1102" y="1928" class="field-small">+ confidence: float</text>
    <text x="1102" y="1958" class="field-small">+ warnings: list[str]</text>
    <text x="1102" y="1988" class="field-small">+ requires_human_review: bool</text>
    <text x="1102" y="2018" class="field-small">+ messages: list[AgentMessage]</text>
  </g>

  <g aria-label="AgentFindings">
    <rect x="1798" y="1640" width="534" height="72" class="support-box"/>
    <path d="M1810 1640 H2320 Q2332 1640 2332 1652 V1712 H1798 V1652 Q1798 1640 1810 1640 Z" class="header-gray"/>
    <text x="2065" y="1685" text-anchor="middle" class="class-name" style="font-size:31px">AgentFindings</text>
  </g>

  <g aria-label="AgentMessage">
    <rect x="1798" y="1830" width="534" height="315" class="class-box"/>
    <path d="M1810 1830 H2320 Q2332 1830 2332 1842 V1902 H1798 V1842 Q1798 1830 1810 1830 Z" class="header-blue"/>
    <text x="2065" y="1875" text-anchor="middle" class="class-name">AgentMessage</text>
    <line x1="1798" y1="1902" x2="2332" y2="1902" class="divider-blue"/>
    <text x="1822" y="1940" class="field-small">+ from_agent: str</text>
    <text x="1822" y="1972" class="field-small">+ to_agent: str | None</text>
    <text x="1822" y="2004" class="field-small">+ message_type: MessageType</text>
    <text x="1822" y="2036" class="field-small">+ content: str</text>
    <text x="1822" y="2068" class="field-small">+ metadata: dict[str, Any]</text>
  </g>

  <!-- Agregacije rezultata -->
  <path d="M998 1100 H1078" class="association"/>
  <text x="1008" y="1084" class="multiplicity">1</text><text x="1048" y="1084" class="multiplicity">1</text>
  <path d="M998 1340 H1078" class="association"/>
  <text x="1008" y="1324" class="multiplicity">1</text><text x="1048" y="1324" class="multiplicity">1</text>
  <path d="M998 1515 H1600 V1500 H1638" class="association"/>
  <text x="1008" y="1498" class="multiplicity">1</text><text x="1580" y="1485" class="multiplicity">0..*</text>
  <path d="M998 1670 H1078" class="association"/>
  <text x="1008" y="1654" class="multiplicity">1</text><text x="1030" y="1698" class="multiplicity">0..*</text>

  <!-- Agregacije agentskog odgovora -->
  <path d="M1728 1676 H1798" class="association"/>
  <text x="1738" y="1660" class="multiplicity">1</text><text x="1770" y="1660" class="multiplicity">1</text>
  <path d="M1728 1940 H1798" class="association"/>
  <text x="1738" y="1924" class="multiplicity">1</text><text x="1748" y="1968" class="multiplicity">0..*</text>
  <path d="M1450 1640 V1612 H1985 V1580" class="association"/>
  <text x="1464" y="1627" class="multiplicity">1</text><text x="1998" y="1610" class="multiplicity">0..*</text>
</svg>
